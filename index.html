<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Editor Advanced</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<script>
(function () {
  var t;
  try { t = localStorage.getItem('mdadv.theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root {
  --bg: #ffffff;
  --bg2: #f6f8fa;
  --bg3: #eaeef2;
  --border: #d0d7de;
  --text: #1f2328;
  --text-dim: #646c76;
  --accent: #0969da;
  --accent-soft: rgba(9, 105, 218, 0.12);
  --code-bg: #f6f8fa;
  --shadow: rgba(31, 35, 40, 0.08);
  --hl-kw: #cf222e;
  --hl-str: #0a3069;
  --hl-num: #0550ae;
  --hl-com: #6e7781;
  --hl-fn: #6639ba;
  --hl-type: #953800;
  --hl-var: #0550ae;
  --hl-meta: #82071e;
  --find-bg: rgba(255, 213, 0, 0.35);
  --find-cur: rgba(255, 140, 0, 0.6);
}
:root[data-theme="dark"] {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --text-dim: #8d96a0;
  --accent: #4493f8;
  --accent-soft: rgba(68, 147, 248, 0.15);
  --code-bg: #161b22;
  --shadow: rgba(0, 0, 0, 0.4);
  --hl-kw: #ff7b72;
  --hl-str: #a5d6ff;
  --hl-num: #79c0ff;
  --hl-com: #8b949e;
  --hl-fn: #d2a8ff;
  --hl-type: #ffa657;
  --hl-var: #79c0ff;
  --hl-meta: #ffa198;
  --find-bg: rgba(255, 213, 0, 0.22);
  --find-cur: rgba(255, 140, 0, 0.55);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---------- Toolbar ---------- */
#toolbar {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-wrap: wrap;
  padding: 6px 10px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  user-select: none;
  -webkit-user-select: none;
}
.tb-group { display: flex; align-items: center; gap: 2px; }
.tb-sep {
  width: 1px;
  height: 20px;
  background: var(--border);
  margin: 0 6px;
  flex: none;
}
.tb-spacer { flex: 1; }
button.tb {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--text);
  width: 30px;
  height: 28px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 14px;
  padding: 0;
}
button.tb:hover { background: var(--bg3); }
button.tb:active { background: var(--accent-soft); }
button.tb svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
button.tb .glyph { font-size: 14px; line-height: 1; }
button.tb .glyph.b { font-weight: 800; }
button.tb .glyph.i { font-style: italic; font-family: Georgia, serif; font-weight: 600; }
button.tb .glyph.s { text-decoration: line-through; }
button.tb .glyph.h { font-weight: 700; }
button.tb .glyph.q { font-family: Georgia, serif; font-weight: 700; font-size: 20px; line-height: 0.4; padding-top: 10px; }

/* segmented view-mode control */
#viewSeg {
  display: flex;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 2px;
  gap: 2px;
}
#viewSeg button {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 5px;
  cursor: pointer;
}
#viewSeg button.active {
  background: var(--bg);
  color: var(--text);
  box-shadow: 0 1px 2px var(--shadow);
}
button.tb.toggled { background: var(--accent-soft); color: var(--accent); }

/* ---------- Main area ---------- */
#main {
  flex: 1;
  display: flex;
  min-height: 0;
}
#editorPane, #previewPane {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
#editorPane { border-right: 1px solid var(--border); background: var(--bg); }
#editorWrap {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  flex-direction: column;
}
body.mode-edit #previewPane { display: none; }
body.mode-edit #editorPane { border-right: none; }
body.mode-preview #editorPane { display: none; }

/* The editor is a transparent textarea over a coloured copy of its text.
   Every property below that affects glyph placement or wrapping must stay
   identical on both, or the two layers drift. */
#editor, #overlayText, #findLayer {
  margin: 0;
  padding: 24px 28px;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 13.5px;
  line-height: 1.7;
  letter-spacing: normal;
  tab-size: 2;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  word-break: normal;
  hyphens: none;
  text-indent: 0;
}
#editor {
  flex: 1;
  width: 100%;
  border: none;
  resize: none;
  outline: none;
  position: relative;
  z-index: 1;
  background: transparent;
  color: transparent;
  caret-color: var(--accent);
}
#editor::placeholder { color: var(--text-dim); opacity: 1; }
#editor::selection { background: var(--accent-soft); }
#overlay {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  color: var(--text);
}
#overlayScroll { position: relative; will-change: transform; }
#findLayer { position: absolute; inset: 0; color: transparent; }
.f-m { background: var(--find-bg); border-radius: 2px; }
.f-cur { background: var(--find-cur); border-radius: 2px; }

/* ---------- Find bar ---------- */
#findBar {
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  padding: 6px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
}
#findBar[hidden] { display: none; }
.find-row { display: flex; align-items: center; gap: 4px; }
.find-row input {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-size: 12px;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  outline: none;
}
.find-row input:focus { border-color: var(--accent); }
#findCount {
  color: var(--text-dim);
  white-space: nowrap;
  min-width: 72px;
  text-align: right;
  padding: 0 4px;
  font-variant-numeric: tabular-nums;
}
#findCount.bad { color: var(--hl-kw); }
button.fb {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--text);
  height: 24px;
  min-width: 26px;
  padding: 0 6px;
  border-radius: 5px;
  cursor: pointer;
  font: inherit;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
button.fb:hover { background: var(--bg3); }
button.fb:active { background: var(--accent-soft); }
button.fb.toggled { background: var(--accent-soft); color: var(--accent); }
button.fb:disabled { opacity: 0.4; cursor: default; background: transparent; }
/* Overlay tokens: colour and decoration only, never weight, style, size or family. */
.o-h, .o-hmark { color: var(--accent); }
.o-code { color: var(--hl-str); }
.o-fence { color: var(--text-dim); }
.o-mark { color: var(--hl-num); }
.o-strong { color: var(--hl-type); }
.o-del { color: var(--text-dim); text-decoration: line-through; }
.o-link { color: var(--accent); }
.o-url { color: var(--text-dim); text-decoration: underline; }
.o-quote { color: var(--hl-fn); }
.o-quotebody { color: var(--text-dim); }
.o-list { color: var(--hl-num); }
.o-task { color: var(--hl-fn); }
.o-pipe, .o-hr, .o-tag { color: var(--text-dim); }

#previewPane {
  overflow-y: auto;
  position: relative;
  scroll-behavior: auto;
}
#preview {
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
  padding: 24px 32px 60vh;
}

/* ---------- TOC sidebar ---------- */
#toc {
  width: 240px;
  flex: none;
  border-left: 1px solid var(--border);
  background: var(--bg2);
  overflow-y: auto;
  padding: 12px 8px;
  display: none;
}
body.toc-open #toc { display: block; }
.side-tabs {
  display: flex;
  gap: 2px;
  margin: 0 2px 8px;
  border-bottom: 1px solid var(--border);
}
.side-tab {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font: inherit;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 4px 8px 8px;
  margin-bottom: -1px;
  border-bottom: 2px solid transparent;
  cursor: pointer;
}
.side-tab:hover { color: var(--text); }
.side-tab.active { color: var(--text); border-bottom-color: var(--accent); }
.docs-head { display: flex; justify-content: flex-end; padding: 0 2px 6px; }
.doc-item {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 6px 6px 8px;
  border-radius: 6px;
  border-left: 2px solid transparent;
  cursor: pointer;
}
.doc-item:hover { background: var(--bg3); }
.doc-item.active { background: var(--accent-soft); border-left-color: var(--accent); }
.doc-main { flex: 1; min-width: 0; }
.doc-name { font-size: 12.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-item.active .doc-name { color: var(--accent); }
.doc-meta { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
.doc-actions { display: none; gap: 2px; flex: none; }
.doc-item:hover .doc-actions, .doc-item.confirm .doc-actions { display: flex; }
.doc-btn {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--text-dim);
  height: 22px;
  min-width: 22px;
  padding: 0;
  border-radius: 4px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font: inherit;
  font-size: 11px;
  font-weight: 600;
}
.doc-btn:hover { background: var(--bg); color: var(--text); }
.doc-btn.text { padding: 0 6px; }
.doc-btn.danger { color: var(--hl-kw); }
.doc-btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.doc-rename {
  width: 100%;
  font: inherit;
  font-size: 12.5px;
  padding: 2px 4px;
  border: 1px solid var(--accent);
  border-radius: 4px;
  background: var(--bg);
  color: var(--text);
  outline: none;
}
.docs-empty { padding: 2px 10px; font-size: 12.5px; color: var(--text-dim); }
#toc a {
  display: block;
  padding: 3px 10px;
  font-size: 12.5px;
  color: var(--text-dim);
  text-decoration: none;
  border-radius: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border-left: 2px solid transparent;
}
#toc a:hover { background: var(--bg3); color: var(--text); }
#toc a.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); }
#toc a[data-level="2"] { padding-left: 22px; }
#toc a[data-level="3"] { padding-left: 34px; }
#toc a[data-level="4"] { padding-left: 46px; }
#toc a[data-level="5"] { padding-left: 58px; }
#toc a[data-level="6"] { padding-left: 70px; }
#toc .toc-empty { padding: 2px 10px; font-size: 12.5px; color: var(--text-dim); }

/* ---------- Status bar ---------- */
#status {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 4px 12px;
  font-size: 11.5px;
  color: var(--text-dim);
  background: var(--bg2);
  border-top: 1px solid var(--border);
  user-select: none;
  -webkit-user-select: none;
}
#status .spacer { flex: 1; }
#fileLabel { display: flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#dirtyDot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  display: none; flex: none;
}
body.dirty #dirtyDot { display: inline-block; }

/* ---------- Drag & drop overlay ---------- */
#dropOverlay {
  position: fixed;
  inset: 0;
  background: var(--accent-soft);
  border: 3px dashed var(--accent);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 600;
  color: var(--accent);
  z-index: 100;
  pointer-events: none;
}
body.dragging #dropOverlay { display: flex; }

/* ---------- Preview typography ---------- */
#preview { font-size: 15px; line-height: 1.65; word-wrap: break-word; }
#preview > :first-child { margin-top: 0; }
#preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 {
  margin: 1.5em 0 0.6em;
  font-weight: 650;
  line-height: 1.25;
  scroll-margin-top: 12px;
}
#preview h1 { font-size: 1.9em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
#preview h2 { font-size: 1.45em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
#preview h3 { font-size: 1.2em; }
#preview h4 { font-size: 1.05em; }
#preview h5 { font-size: 0.95em; }
#preview h6 { font-size: 0.88em; color: var(--text-dim); }
#preview p, #preview ul, #preview ol, #preview blockquote, #preview table, #preview pre { margin: 0 0 1em; }
#preview a { color: var(--accent); text-decoration: none; }
#preview a:hover { text-decoration: underline; }
#preview img { max-width: 100%; border-radius: 6px; }
#preview code {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 0.86em;
  background: var(--bg3);
  padding: 0.15em 0.4em;
  border-radius: 5px;
}
#preview pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  overflow-x: auto;
  line-height: 1.5;
}
#preview pre code { background: none; padding: 0; font-size: 0.85em; display: block; }
#preview blockquote {
  border-left: 3px solid var(--border);
  padding: 0.1em 1em;
  color: var(--text-dim);
}
#preview blockquote > :last-child { margin-bottom: 0; }
#preview ul, #preview ol { padding-left: 1.8em; }
#preview li { margin: 0.2em 0; }
#preview li.task-item { list-style: none; margin-left: -1.4em; }
#preview li input[type="checkbox"] { margin-right: 0.5em; vertical-align: -1px; accent-color: var(--accent); }
#preview hr { border: none; border-top: 2px solid var(--border); margin: 2em 0; }
#preview table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; }
#preview th, #preview td { border: 1px solid var(--border); padding: 6px 13px; }
#preview th { background: var(--bg2); font-weight: 600; }
#preview tr:nth-child(2n) td { background: var(--bg2); }
#preview del { color: var(--text-dim); }
#preview mark { background: #fff8c5; }
:root[data-theme="dark"] #preview mark { background: #5a4a00; color: #e6edf3; }

/* ---------- highlight.js theme (mapped to app palette) ---------- */
.hljs { color: var(--text); }
.hljs-comment, .hljs-quote { color: var(--hl-com); font-style: italic; }
.hljs-keyword, .hljs-selector-tag, .hljs-tag, .hljs-name, .hljs-deletion { color: var(--hl-kw); }
.hljs-string, .hljs-regexp, .hljs-addition { color: var(--hl-str); }
.hljs-number, .hljs-literal, .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-selector-attr, .hljs-selector-pseudo, .hljs-operator { color: var(--hl-var); }
.hljs-title, .hljs-title.function_, .hljs-section { color: var(--hl-fn); font-weight: 600; }
.hljs-title.class_, .hljs-type, .hljs-built_in, .hljs-builtin-name, .hljs-selector-class, .hljs-selector-id { color: var(--hl-type); }
.hljs-meta, .hljs-doctag, .hljs-symbol, .hljs-bullet, .hljs-link { color: var(--hl-meta); }
.hljs-emphasis { font-style: italic; }
.hljs-strong { font-weight: 700; }

/* ---------- Scrollbars ---------- */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- Print ---------- */
/* The app is a fixed-height flex layout with the preview scrolling inside its
   pane. Printing needs the document to flow, so every scroll container is
   opened up and only the preview remains. */
@media print {
  @page { margin: 18mm 16mm; }
  /* Full black on paper; the screen palette's soft dark grey prints light. */
  :root { --text: #000; --text-dim: #444; --border: #bbb; }
  html, body { height: auto; overflow: visible; background: #fff; }
  #toolbar, #findBar, #editorPane, #toc, #status, #dropOverlay { display: none !important; }
  #main { display: block; }
  #previewPane { display: block !important; overflow: visible; position: static; }
  #preview { max-width: none; padding: 0; font-size: 12pt; }
  #preview pre, #preview blockquote, #preview img, #preview tr { break-inside: avoid; }
  #preview h1, #preview h2, #preview h3, #preview h4 { break-after: avoid; }
  #preview pre { white-space: pre-wrap; overflow-wrap: break-word; overflow: visible; }
  #preview table { display: table; overflow: visible; }
  #preview a { color: inherit; text-decoration: underline; }
}
</style>
</head>

  <div class="tb-sep"></div>

    </button>

    </button>
    <button class="tb" data-action="code" title="Inline code (⌘E)">
      <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    </button>
    <button class="tb" data-action="codeblock" title="Code block">
      <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="9 9 6 12 9 15"/><polyline points="15 9 18 12 15 15"/></svg>
    </button>
  </div>

<script>
(function () {
  'use strict';

  /* ---------- Elements & state ---------- */
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const previewPane = document.getElementById('previewPane');
  const tocList = document.getElementById('tocList');
  const fileInput = document.getElementById('fileInput');
  const body = document.body;

  let mode = 'split';          // 'edit' | 'split' | 'preview'
  let fileHandle = null;       // FileSystemFileHandle when opened/saved via picker
  let fileName = '';
  let dirty = false;
  let headingEls = [];         // headings in the preview, in order
  let headingLines = [];       // matching source line numbers (ATX), when counts align
  let scrollLock = null;       // guards the scroll-sync feedback loop
  let scrollLockTimer = 0;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  const debounce = (fn, ms) => {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  };

  /* ---------- Markdown rendering ---------- */
  marked.use({ gfm: true });

  function slugify(text) {
    return text.toLowerCase().trim()
      .replace(/[^\w\s-]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-') || 'section';
  }

  function render() {
    let html;
    try {
      html = marked.parse(editor.value);
    } catch (e) {
      html = '<p><em>Could not render: ' + String(e.message || e).replace(/</g, '&lt;') + '</em></p>';
    }
    preview.innerHTML = DOMPurify.sanitize(html);

    preview.querySelectorAll('pre code').forEach(el => {
      if (/\blanguage-/.test(el.className)) {
        try { hljs.highlightElement(el); } catch (e) {}
      }
    });

    preview.querySelectorAll('li').forEach(li => {
      if (li.querySelector(':scope > input[type="checkbox"]')) li.classList.add('task-item');
    });

    const seen = Object.create(null);
    headingEls = Array.from(preview.querySelectorAll('h1,h2,h3,h4,h5,h6'));
    headingEls.forEach(h => {
      let id = slugify(h.textContent);
      if (seen[id] != null) { seen[id]++; id += '-' + seen[id]; } else { seen[id] = 0; }
      h.id = id;
    });

    const atx = findAtxHeadingLines(editor.value);
    headingLines = atx.length === headingEls.length ? atx : [];

    buildToc();
    updateScrollSpy();
  }

  // Source line numbers of ATX headings, ignoring fenced code blocks.
  function findAtxHeadingLines(md) {
    const lines = md.split('\n');
    const out = [];
    let fence = null;
    for (let i = 0; i < lines.length; i++) {
      const fm = lines[i].match(/^\s*(`{3,}|~{3,})/);
      if (fm) {
        if (!fence) fence = fm[1][0];
        else if (fm[1][0] === fence) fence = null;
        continue;
      }
      if (!fence && /^ {0,3}#{1,6}\s/.test(lines[i])) out.push(i);
    }
    return out;
  }

  /* ---------- Table of contents ---------- */
  function buildToc() {
    tocList.textContent = '';
    if (!headingEls.length) {
      const p = document.createElement('div');
      p.className = 'toc-empty';
      p.textContent = 'No headings yet';
      tocList.appendChild(p);
      return;
    }
    headingEls.forEach((h, i) => {
      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.dataset.level = h.tagName[1];
      a.dataset.index = i;
      a.addEventListener('click', e => {
        e.preventDefault();
        jumpToHeading(i);
      });
      tocList.appendChild(a);
    });
  }

  // Chromium cancels native smooth scrolls when another element is scrolled
  // programmatically (as the split-view sync does), so drive the animation ourselves.
  function animateScroll(el, target, ms = 260) {
    if (document.visibilityState === 'hidden') { el.scrollTop = target; return; }
    const start = el.scrollTop, dist = target - start, t0 = performance.now();
    cancelAnimationFrame(el._scrollAnim);
    const step = t => {
      const p = Math.min(1, (t - t0) / ms);
      const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      el.scrollTop = start + dist * e;
      if (p < 1) el._scrollAnim = requestAnimationFrame(step);
    };
    el._scrollAnim = requestAnimationFrame(step);
  }

  function jumpToHeading(i) {
    const h = headingEls[i];
    scrollLock = 'toc';
    clearTimeout(scrollLockTimer);
    scrollLockTimer = setTimeout(() => { scrollLock = null; }, 340);
    if (mode !== 'edit' && h) {
      animateScroll(previewPane, Math.max(0, h.offsetTop - 8));
    }
    if (mode !== 'preview' && headingLines.length) {
      jumpEditorToLine(headingLines[i]);
    }
  }

  function jumpEditorToLine(lineNo) {
    const lines = editor.value.split('\n');
    let pos = 0;
    for (let i = 0; i < lineNo && i < lines.length; i++) pos += lines[i].length + 1;
    editor.setSelectionRange(pos, pos + (lines[lineNo] || '').length);
    const lineHeight = parseFloat(getComputedStyle(editor).lineHeight) || 22;
    const padTop = parseFloat(getComputedStyle(editor).paddingTop) || 0;
    scrollLock = 'toc';
    clearTimeout(scrollLockTimer);
    scrollLockTimer = setTimeout(() => { scrollLock = null; }, 150);
    editor.scrollTop = Math.max(0, lineNo * lineHeight + padTop - 60);
    if (mode === 'edit') editor.focus();
  }

  function updateScrollSpy() {
    if (!headingEls.length) return;
    // A heading counts as current once it is in the top third of the pane,
    // so the section filling most of the view is the one highlighted.
    const top = previewPane.scrollTop + Math.max(48, previewPane.clientHeight * 0.3);
    let active = 0;
    for (let i = 0; i < headingEls.length; i++) {
      if (headingEls[i].offsetTop <= top) active = i;
      else break;
    }
    // Scrolled to the end: the final section is on screen even if its heading
    // never reaches the top of the pane.
    const maxScroll = previewPane.scrollHeight - previewPane.clientHeight;
    if (maxScroll > 0 && previewPane.scrollTop >= maxScroll - 2) active = headingEls.length - 1;
    tocList.querySelectorAll('a').forEach((a, i) => {
      a.classList.toggle('active', i === active);
    });
  }

  /* ---------- Editor overlay (markdown highlighting) ---------- */
  // A coloured copy of the source sits under the transparent textarea. Only
  // colour and text-decoration are applied, so glyph widths match exactly.
  const overlayScroll = document.getElementById('overlayScroll');
  const overlayText = document.getElementById('overlayText');

  const escHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const tok = (cls, s) => s ? '<span class="' + cls + '">' + escHtml(s) + '</span>' : '';

  // Inline constructs, tried left to right at each position:
  //  1-2 code span   3-7 link/image   8 autolink   9-10 strong
  //  11-12 emphasis  13-14 strikethrough  then html tag, then bare URL
  const INLINE_RE = /(`+)([\s\S]*?[^`])\1(?!`)|(!?\[)([^\]]*)(\]\()([^)]*)(\))|<((?:https?:\/\/|mailto:)[^>\s]+|[^\s@<>]+@[^\s@<>]+)>|(\*\*|__)(?=\S)([\s\S]*?\S)\9|(?<![A-Za-z0-9])(\*|_)(?=\S)([^*_]*?\S)\11(?![A-Za-z0-9])|(~~)(?=\S)([\s\S]*?\S)\13|<\/?[A-Za-z][^<>]*>|https?:\/\/[^\s<>]+/g;

  function hlInline(s) {
    let out = '', last = 0, m;
    INLINE_RE.lastIndex = 0;
    while ((m = INLINE_RE.exec(s))) {
      const next = INLINE_RE.lastIndex;
      out += escHtml(s.slice(last, m.index));
      last = next;
      if (m[1] !== undefined) out += tok('o-code', m[0]);
      else if (m[3] !== undefined) out += tok('o-mark', m[3]) + tok('o-link', m[4]) + tok('o-mark', m[5]) + tok('o-url', m[6]) + tok('o-mark', m[7]);
      else if (m[8] !== undefined) out += tok('o-mark', '<') + tok('o-url', m[8]) + tok('o-mark', '>');
      else if (m[9] !== undefined) out += tok('o-mark', m[9]) + '<span class="o-strong">' + hlInline(m[10]) + '</span>' + tok('o-mark', m[9]);
      else if (m[11] !== undefined) out += tok('o-mark', m[11]) + '<span class="o-em">' + hlInline(m[12]) + '</span>' + tok('o-mark', m[11]);
      else if (m[13] !== undefined) out += tok('o-mark', '~~') + '<span class="o-del">' + hlInline(m[14]) + '</span>' + tok('o-mark', '~~');
      else if (m[0][0] === '<') out += tok('o-tag', m[0]);
      else out += tok('o-url', m[0]);
      INLINE_RE.lastIndex = next; // recursion above resets it
    }
    return out + escHtml(s.slice(last));
  }

  function hlBlock(line) {
    let out = '', rest = line, m;
    const bq = rest.match(/^(\s{0,3}>\s?)+/);
    if (bq) {
      out += tok('o-quote', bq[0]);
      rest = rest.slice(bq[0].length);
      return out + '<span class="o-quotebody">' + hlBlock(rest) + '</span>';
    }
    if ((m = rest.match(/^(\s{0,3}#{1,6})(\s+|$)([\s\S]*)$/))) {
      return out + tok('o-hmark', m[1] + m[2]) + '<span class="o-h">' + hlInline(m[3]) + '</span>';
    }
    if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(rest)) return out + tok('o-hr', rest);
    if (/^\s{0,3}=+\s*$/.test(rest)) return out + tok('o-hmark', rest);
    if ((m = rest.match(/^(\s*)([-*+]|\d{1,9}[.)])(\s+)/))) {
      out += escHtml(m[1]) + tok('o-list', m[2]) + escHtml(m[3]);
      rest = rest.slice(m[0].length);
      const t = rest.match(/^\[[ xX]\](?=\s|$)/);
      if (t) { out += tok('o-task', t[0]); rest = rest.slice(t[0].length); }
    }
    if (rest.includes('|')) {
      if (/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(rest)) return out + tok('o-pipe', rest);
      return out + rest.split(/(\|)/).map(p => p === '|' ? tok('o-pipe', p) : hlInline(p)).join('');
    }
    return out + hlInline(rest);
  }

  function highlightMarkdown(text) {
    const lines = text.split('\n');
    const out = new Array(lines.length);
    let fence = null;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const fm = line.match(/^(\s{0,3})(`{3,}|~{3,})(.*)$/);
      if (fence) {
        if (fm && fm[2][0] === fence.ch && fm[2].length >= fence.len && !fm[3].trim()) {
          out[i] = tok('o-fence', line);
          fence = null;
        } else {
          out[i] = tok('o-code', line);
        }
        continue;
      }
      if (fm && !(fm[2][0] === '`' && fm[3].includes('`'))) {
        fence = { ch: fm[2][0], len: fm[2].length };
        out[i] = tok('o-fence', line);
        continue;
      }
      out[i] = hlBlock(line);
    }
    // A trailing newline inside a block is dropped by the renderer, but the
    // textarea shows the empty line after it. One extra newline keeps them equal.
    return out.join('\n') + '\n';
  }

  function renderOverlay() {
    overlayText.innerHTML = highlightMarkdown(editor.value);
    fitOverlay(); // a scrollbar may have appeared or gone with this edit
    refreshFind();
  }

  let overlayScrollPending = false;
  function syncOverlayScroll() {
    if (overlayScrollPending) return;
    overlayScrollPending = true;
    requestAnimationFrame(() => {
      overlayScrollPending = false;
      overlayScroll.style.transform = 'translate(' + (-editor.scrollLeft) + 'px,' + (-editor.scrollTop) + 'px)';
    });
  }

  // The overlay must wrap at the textarea's content width, which excludes any
  // visible scrollbar, so it is sized from clientWidth rather than 100%.
  let overlayWidth = -1;
  function fitOverlay() {
    const w = editor.clientWidth;
    if (w !== overlayWidth) {
      overlayWidth = w;
      overlayScroll.style.width = w + 'px';
    }
    syncOverlayScroll();
  }
  new ResizeObserver(fitOverlay).observe(editor);


  /* ---------- Keep a position on screen ---------- */
  // The overlay is a live, laid-out mirror of the textarea, so a text offset
  // can be measured there with a Range instead of a separate hidden copy.
  function overlayLineTop(pos) {
    const walker = document.createTreeWalker(overlayText, NodeFilter.SHOW_TEXT);
    let node, acc = 0;
    while ((node = walker.nextNode())) {
      const len = node.nodeValue.length;
      if (pos < acc + len) {
        const r = document.createRange();
        r.setStart(node, pos - acc);
        r.setEnd(node, pos - acc + 1);
        const rects = r.getClientRects();
        if (!rects.length) return null;
        return rects[0].top - overlayScroll.getBoundingClientRect().top;
      }
      acc += len;
    }
    return null;
  }

  // Scroll the textarea so the line holding `pos` is visible. With `center`
  // the line lands a third of the way down, which suits jumping to a match.
  function revealEditorPos(pos, center) {
    const top = overlayLineTop(pos);
    if (top == null) return;
    const lineHeight = parseFloat(getComputedStyle(editor).lineHeight) || 22;
    const bottom = top + lineHeight;
    const margin = 8;
    const viewTop = editor.scrollTop;
    const viewBottom = viewTop + editor.clientHeight;
    if (top >= viewTop + margin && bottom <= viewBottom - margin) return;
    let target;
    if (center) target = top - editor.clientHeight / 3;
    else if (top < viewTop + margin) target = top - margin;
    else target = bottom - editor.clientHeight + margin;
    scrollLock = 'editor';
    clearTimeout(scrollLockTimer);
    scrollLockTimer = setTimeout(() => { scrollLock = null; }, 200);
    editor.scrollTop = Math.max(0, target);
  }

  // A textarea scrolls its caret into view natively, but the split-view sync
  // can move the editor again right after (the preview re-renders, fires a
  // scroll event, and mirrors its position back). Put the caret back on screen.
  function ensureCaretVisible() {
    if (document.activeElement !== editor) return;
    revealEditorPos(editor.selectionEnd, false);
  }

  /* ---------- Find and replace ---------- */
  const findBar = document.getElementById('findBar');
  const findInput = document.getElementById('findInput');
  const replaceInput = document.getElementById('replaceInput');
  const findCount = document.getElementById('findCount');
  const findLayer = document.getElementById('findLayer');
  const btnFindPrev = document.getElementById('findPrev');
  const btnFindNext = document.getElementById('findNext');
  const btnFindCase = document.getElementById('findCase');
  const btnFindRegex = document.getElementById('findRegex');
  const btnReplaceOne = document.getElementById('replaceOne');
  const btnReplaceAll = document.getElementById('replaceAll');

  const find = { open: false, matches: [], current: -1, caseSensitive: false, regex: false, invalid: false };
  const MAX_FIND_MARKS = 2000;   // marks drawn in the overlay; the count is always exact

  // null: empty query. false: invalid regex.
  function findRegex(global) {
    const q = findInput.value;
    if (!q) return null;
    const src = find.regex ? q : q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    try { return new RegExp(src, (global ? 'g' : '') + (find.caseSensitive ? '' : 'i')); }
    catch (e) { return false; }
  }

  function collectMatches() {
    find.matches = [];
    find.invalid = false;
    const re = findRegex(true);
    if (re === null) return;
    if (re === false) { find.invalid = true; return; }
    const v = editor.value;
    let m;
    while ((m = re.exec(v))) {
      if (m[0] === '') { re.lastIndex++; continue; }
      find.matches.push([m.index, m.index + m[0].length]);
      if (find.matches.length >= 100000) break;
    }
  }

  // Index of the first match starting at or after pos (may equal length).
  function lowerBound(pos) {
    const ms = find.matches;
    let lo = 0, hi = ms.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (ms[mid][0] < pos) lo = mid + 1; else hi = mid;
    }
    return lo;
  }
  function matchAtOrAfter(pos) {
    const n = find.matches.length;
    if (!n) return -1;
    const i = lowerBound(pos);
    return i < n ? i : 0;
  }

  function renderFindLayer() {
    if (!find.open || !find.matches.length) { findLayer.innerHTML = ''; return; }
    const v = editor.value;
    const ms = find.matches;
    let from = 0, to = ms.length;
    if (ms.length > MAX_FIND_MARKS) {
      from = Math.max(0, find.current - MAX_FIND_MARKS / 2);
      to = Math.min(ms.length, from + MAX_FIND_MARKS);
    }
    let out = '', last = 0;
    for (let i = from; i < to; i++) {
      const s = ms[i][0], e = ms[i][1];
      out += escHtml(v.slice(last, s)) +
        '<span class="' + (i === find.current ? 'f-cur' : 'f-m') + '">' + escHtml(v.slice(s, e)) + '</span>';
      last = e;
    }
    findLayer.innerHTML = out + escHtml(v.slice(last)) + '\n';
  }

  function updateFindCount() {
    let text = '', bad = false;
    if (find.invalid) { text = 'Invalid regex'; bad = true; }
    else if (!findInput.value) text = '';
    else if (!find.matches.length) { text = 'No results'; bad = true; }
    else text = (find.current + 1) + ' of ' + find.matches.length;
    findCount.textContent = text;
    findCount.classList.toggle('bad', bad);
    const none = !find.matches.length;
    [btnFindPrev, btnFindNext, btnReplaceOne, btnReplaceAll].forEach(b => { b.disabled = none; });
  }

  // Recompute after the text or the query changed. The current match becomes
  // the first one at or after the caret. Does not touch the textarea selection.
  function refreshFind() {
    if (!find.open) return;
    collectMatches();
    find.current = matchAtOrAfter(editor.selectionStart);
    renderFindLayer();
    updateFindCount();
  }

  // Select the current match in the textarea and bring it on screen.
  function showCurrentMatch() {
    const m = find.matches[find.current];
    if (!m) return;
    editor.setSelectionRange(m[0], m[1]);
    revealEditorPos(m[0], true);
    renderFindLayer();
    updateFindCount();
    updateCursor();
  }

  function findStep(dir) {
    const ms = find.matches;
    if (!ms.length) return;
    const cur = ms[find.current];
    const onCurrent = cur && editor.selectionStart === cur[0] && editor.selectionEnd === cur[1];
    if (onCurrent) find.current = (find.current + dir + ms.length) % ms.length;
    else if (dir > 0) find.current = matchAtOrAfter(editor.selectionEnd);
    else find.current = (lowerBound(editor.selectionStart) - 1 + ms.length) % ms.length;
    showCurrentMatch();
  }

  function openFind() {
    const sel = editor.value.slice(editor.selectionStart, editor.selectionEnd);
    findBar.hidden = false;
    find.open = true;
    if (sel && !sel.includes('\n')) findInput.value = sel;
    findInput.focus();
    findInput.select();
    refreshFind();
    showCurrentMatch();
  }

  function closeFind() {
    if (!find.open) return;
    findBar.hidden = true;
    find.open = false;
    find.matches = [];
    findLayer.innerHTML = '';
    if (mode !== 'preview') editor.focus();
  }

  function replacementFor(matchText) {
    if (!find.regex) return replaceInput.value;
    const re = findRegex(false);
    return re ? matchText.replace(re, replaceInput.value) : replaceInput.value;
  }

  // Both replacements go through insertText so they sit on the native undo
  // stack. The input event they raise recomputes the matches.
  function replaceOne() {
    const m = find.matches[find.current];
    if (!m) return;
    const prev = document.activeElement;
    insertText(m[0], m[1], replacementFor(editor.value.slice(m[0], m[1])));
    if (prev && findBar.contains(prev)) prev.focus();
    showCurrentMatch();
  }

  function replaceAll() {
    const ms = find.matches;
    if (!ms.length) return;
    const v = editor.value;
    const start = ms[0][0], end = ms[ms.length - 1][1];
    let out = '', last = start;
    for (const [s, e] of ms) { out += v.slice(last, s) + replacementFor(v.slice(s, e)); last = e; }
    const n = ms.length;
    const prev = document.activeElement;
    insertText(start, end, out);   // one span, one undo step
    if (prev && findBar.contains(prev)) prev.focus();
    findCount.textContent = 'Replaced ' + n;
    findCount.classList.remove('bad');
  }

  function setFindToggle(btn, key, on) {
    find[key] = on;
    btn.classList.toggle('toggled', on);
    btn.setAttribute('aria-pressed', String(on));
    refreshFind();
    showCurrentMatch();
    findInput.focus();
  }

  findInput.addEventListener('input', () => { refreshFind(); showCurrentMatch(); });
  findInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); }
    else if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
  });
  replaceInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); if (e.metaKey || e.ctrlKey) replaceAll(); else replaceOne(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
  });
  // Buttons act on the field that has focus, so a click must not steal it.
  findBar.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
  btnFindPrev.addEventListener('click', () => findStep(-1));
  btnFindNext.addEventListener('click', () => findStep(1));
  btnFindCase.addEventListener('click', () => setFindToggle(btnFindCase, 'caseSensitive', !find.caseSensitive));
  btnFindRegex.addEventListener('click', () => setFindToggle(btnFindRegex, 'regex', !find.regex));
  document.getElementById('findClose').addEventListener('click', closeFind);
  btnReplaceOne.addEventListener('click', replaceOne);
  btnReplaceAll.addEventListener('click', replaceAll);

  /* ---------- Scroll sync (split view) ---------- */
  function syncScroll(srcName, srcEl, dstEl) {
    if (scrollLock && scrollLock !== srcName) return;
    scrollLock = srcName;
    clearTimeout(scrollLockTimer);
    scrollLockTimer = setTimeout(() => { scrollLock = null; }, 120);
    const srcMax = srcEl.scrollHeight - srcEl.clientHeight;
    const dstMax = dstEl.scrollHeight - dstEl.clientHeight;
    if (srcMax > 0 && dstMax > 0) {
      dstEl.scrollTop = (srcEl.scrollTop / srcMax) * dstMax;
    }
  }

  editor.addEventListener('scroll', () => {
    syncOverlayScroll();
    if (mode === 'split') syncScroll('editor', editor, previewPane);
  });
  previewPane.addEventListener('scroll', () => {
    requestAnimationFrame(updateScrollSpy);
    if (mode === 'split') syncScroll('preview', previewPane, editor);
  });

  /* ---------- Preview link handling ---------- */
  preview.addEventListener('click', e => {
    const a = e.target.closest('a');
    if (!a) return;
    const href = a.getAttribute('href') || '';
    e.preventDefault();
    if (href.startsWith('#')) {
      const target = document.getElementById(href.slice(1));
      if (target) {
        scrollLock = 'toc';
        clearTimeout(scrollLockTimer);
        scrollLockTimer = setTimeout(() => { scrollLock = null; }, 340);
        animateScroll(previewPane, Math.max(0, target.offsetTop - 8));
      }
    } else if (/^https?:/i.test(href)) {
      window.open(href, '_blank', 'noopener');
    }
  });

  /* ---------- Editing helpers (undo-friendly) ---------- */
  function insertText(start, end, text) {
    editor.focus();
    editor.setSelectionRange(start, end);
    let ok = false;
    try {
      ok = text === ''
        ? document.execCommand('delete', false)
        : document.execCommand('insertText', false, text);
    } catch (e) {}
    if (!ok) {
      editor.setRangeText(text, start, end, 'end');
      editor.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }

  function wrapSelection(before, after, placeholder) {
    const v = editor.value;
    const start = editor.selectionStart, end = editor.selectionEnd;
    const selected = v.slice(start, end);
    // Toggle off: markers just outside the selection
    if (v.slice(start - before.length, start) === before && v.slice(end, end + after.length) === after) {
      insertText(start - before.length, end + after.length, selected);
      editor.setSelectionRange(start - before.length, start - before.length + selected.length);
      return;
    }
    // Toggle off: markers inside the selection
    if (selected.length >= before.length + after.length &&
        selected.startsWith(before) && selected.endsWith(after)) {
      const inner = selected.slice(before.length, selected.length - after.length);
      insertText(start, end, inner);
      editor.setSelectionRange(start, start + inner.length);
      return;
    }
    const content = selected || placeholder;
    insertText(start, end, before + content + after);
    editor.setSelectionRange(start + before.length, start + before.length + content.length);
  }

  // Bounds of the full lines covering the selection.
  function selectedLineRange() {
    const v = editor.value;
    let start = editor.selectionStart, end = editor.selectionEnd;
    const lineStart = v.lastIndexOf('\n', start - 1) + 1;
    let lineEnd = v.indexOf('\n', end);
    if (lineEnd === -1) lineEnd = v.length;
    return { lineStart, lineEnd };
  }

  function transformLines(fn) {
    const { lineStart, lineEnd } = selectedLineRange();
    const block = editor.value.slice(lineStart, lineEnd);
    const out = fn(block.split('\n')).join('\n');
    if (out === block) return;
    insertText(lineStart, lineEnd, out);
    editor.setSelectionRange(lineStart, lineStart + out.length);
  }

  function prefixLines(makePrefix, detect) {
    transformLines(lines => {
      const allPrefixed = lines.every(l => !l.trim() || detect.test(l));
      if (allPrefixed && lines.some(l => l.trim())) {
        return lines.map(l => l.replace(detect, ''));
      }
      let n = 0;
      return lines.map(l => (l.trim() ? makePrefix(n++) + l.replace(detect, '') : l));
    });
  }

  function insertBlock(text) {
    const v = editor.value;
    const start = editor.selectionStart;
    const atLineStart = start === 0 || v[start - 1] === '\n';
    const prevBlank = start === 0 || /\n\s*\n$/.test(v.slice(0, start)) || v.slice(0, start).trim() === '';
    const prefix = atLineStart ? (prevBlank ? '' : '\n') : '\n\n';
    insertText(start, editor.selectionEnd, prefix + text + '\n');
  }

  const actions = {
    bold: () => wrapSelection('**', '**', 'bold text'),
    italic: () => wrapSelection('*', '*', 'italic text'),
    strike: () => wrapSelection('~~', '~~', 'strikethrough'),
    code: () => wrapSelection('`', '`', 'code'),
    link: () => wrapSelection('[', '](url)', 'link text'),
    image: () => wrapSelection('![', '](url)', 'alt text'),
    heading: () => transformLines(lines => lines.map(l => {
      const m = l.match(/^(#{1,6})\s+/);
      if (!m) return l.trim() ? '# ' + l : l;
      if (m[1].length >= 6) return l.slice(m[0].length);
      return '#' + l;
    })),
    quote: () => prefixLines(() => '> ', /^>\s?/),
    ul: () => prefixLines(() => '- ', /^[-*+]\s(?!\[)/),
    ol: () => prefixLines(n => (n + 1) + '. ', /^\d+[.)]\s/),
    task: () => prefixLines(() => '- [ ] ', /^[-*+]\s\[[ xX]\]\s/),
    codeblock: () => {
      const start = editor.selectionStart, end = editor.selectionEnd;
      const selected = editor.value.slice(start, end);
      const content = selected || 'code';
      insertText(start, end, '```\n' + content + '\n```');
      editor.setSelectionRange(start + 4, start + 4 + content.length);
    },
    table: () => insertBlock(
      '| Column 1 | Column 2 | Column 3 |\n' +
      '| -------- | -------- | -------- |\n' +
      '| Cell     | Cell     | Cell     |'
    ),
    hr: () => insertBlock('---')
  };

  document.querySelectorAll('#toolbar button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => actions[btn.dataset.action]());
  });

  /* ---------- Keyboard handling in the editor ---------- */
  editor.addEventListener('keydown', e => {
    const mod = e.metaKey || e.ctrlKey;

    if (e.key === 'Escape' && find.open) { e.preventDefault(); closeFind(); return; }

    if (mod && !e.altKey && !e.shiftKey) {
      const key = e.key.toLowerCase();
      const map = { b: 'bold', i: 'italic', e: 'code', k: 'link' };
      if (map[key]) { e.preventDefault(); actions[map[key]](); return; }
    }

    if (e.key === 'Tab') {
      e.preventDefault();
      const multiline = editor.value.slice(editor.selectionStart, editor.selectionEnd).includes('\n');
      if (e.shiftKey) {
        transformLines(lines => lines.map(l => l.replace(/^ {1,2}/, '')));
      } else if (multiline) {
        transformLines(lines => lines.map(l => (l.trim() ? '  ' + l : l)));
      } else {
        insertText(editor.selectionStart, editor.selectionEnd, '  ');
      }
      return;
    }

    // Continue lists on Enter
    if (e.key === 'Enter' && !mod && !e.shiftKey && !e.altKey &&
        editor.selectionStart === editor.selectionEnd) {
      const v = editor.value;
      const pos = editor.selectionStart;
      const lineStart = v.lastIndexOf('\n', pos - 1) + 1;
      let lineEnd = v.indexOf('\n', pos);
      if (lineEnd === -1) lineEnd = v.length;
      const line = v.slice(lineStart, lineEnd);
      const m = line.match(/^(\s*)([-*+]|\d+[.)])(\s\[[ xX]\])?\s/);
      if (!m) return;
      const contentAfter = line.slice(m[0].length);
      if (!contentAfter.trim() && pos >= lineEnd) {
        // Empty list item: Enter ends the list
        e.preventDefault();
        insertText(lineStart, lineEnd, '');
        return;
      }
      e.preventDefault();
      let marker = m[2];
      if (/^\d/.test(marker)) marker = (parseInt(marker, 10) + 1) + marker.slice(-1);
      const task = m[3] ? ' [ ]' : '';
      insertText(pos, pos, '\n' + m[1] + marker + task + ' ');
    }
  });

  /* ---------- Global shortcuts ---------- */
  document.addEventListener('keydown', e => {
    const mod = e.metaKey || e.ctrlKey;
    if (!mod || e.altKey) return;
    const key = e.key.toLowerCase();
    if (key === 'f' && !e.shiftKey) {
      if (mode === 'preview') return;   // let the browser search the preview
      e.preventDefault();
      openFind();
      return;
    }
    if (key === 'g' && find.open) { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); return; }
    if (key === 'p' && !e.shiftKey) { e.preventDefault(); window.print(); return; }
    if (e.key === 's') { e.preventDefault(); saveFile(); }
    else if (e.key === '1') { e.preventDefault(); setMode('edit'); }
    else if (e.key === '2') { e.preventDefault(); setMode('split'); }
    else if (e.key === '3') { e.preventDefault(); setMode('preview'); }
    else if (e.key === '.') { e.preventDefault(); toggleToc(); }
  });

  /* ---------- View modes, TOC, theme ---------- */
  function setMode(m) {
    mode = m;
    body.classList.remove('mode-edit', 'mode-split', 'mode-preview');
    body.classList.add('mode-' + m);
    document.querySelectorAll('#viewSeg button').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === m);
    });
    store.set('mdadv.mode', m);
    if (m !== 'preview') editor.focus();
    if (m === 'split') syncScroll('editor', editor, previewPane);
  }
  document.querySelectorAll('#viewSeg button').forEach(b => {
    b.addEventListener('click', () => setMode(b.dataset.mode));
  });

  function toggleToc() {
    const open = body.classList.toggle('toc-open');
    document.getElementById('btnToc').classList.toggle('toggled', open);
    store.set('mdadv.toc', open ? '1' : '0');
  }
  document.getElementById('btnToc').addEventListener('click', toggleToc);

  function applyThemeIcon() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.getElementById('iconSun').style.display = dark ? '' : 'none';
    document.getElementById('iconMoon').style.display = dark ? 'none' : '';
  }
  document.getElementById('btnTheme').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    store.set('mdadv.theme', next);
    applyThemeIcon();
  });

  /* ---------- Status bar ---------- */
  const fileNameEl = document.getElementById('fileName');
  const saveStateEl = document.getElementById('saveState');

  function updateCounts() {
    const v = editor.value;
    const words = v.trim() ? v.trim().split(/\s+/).length : 0;
    document.getElementById('wordCount').textContent =
      words + ' word' + (words === 1 ? '' : 's') + ' · ' + v.length + ' chars';
  }

  function updateCursor() {
    const pos = editor.selectionStart;
    const upTo = editor.value.slice(0, pos);
    const line = (upTo.match(/\n/g) || []).length + 1;
    const col = pos - upTo.lastIndexOf('\n');
    document.getElementById('cursorPos').textContent = 'Ln ' + line + ', Col ' + col;
  }

  function setDirty(d) {
    dirty = d;
    body.classList.toggle('dirty', d);
    if (fileHandle || fileName) {
      saveStateEl.textContent = d ? 'Unsaved changes' : 'Saved';
    }
  }

  function timeNow() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  document.addEventListener('selectionchange', () => {
    if (document.activeElement === editor) updateCursor();
  });
  editor.addEventListener('click', updateCursor);
  editor.addEventListener('keyup', updateCursor);

  /* ---------- Autosave draft ---------- */
  const persistDraft = debounce(() => {
    saveCurrentDoc();
    if (!fileHandle && !fileName) saveStateEl.textContent = 'Auto-saved ' + timeNow();
  }, 400);
  const savePositions = debounce(() => { const doc = captureCurrent(); if (doc) storeDoc(doc); }, 800);

  const renderDebounced = debounce(() => {
    // Re-assert the lock: the editor's own scroll event may have shortened it.
    scrollLock = 'editor';
    clearTimeout(scrollLockTimer);
    scrollLockTimer = setTimeout(() => { scrollLock = null; }, 200);
    render();
    ensureCaretVisible();
  }, 120);

  editor.addEventListener('input', () => {
    renderOverlay();
    setDirty(true);
    // While typing, the editor drives the sync; a preview re-render must not
    // scroll the editor away from the caret.
    scrollLock = 'editor';
    clearTimeout(scrollLockTimer);
    scrollLockTimer = setTimeout(() => { scrollLock = null; }, 300);
    renderDebounced();
    persistDraft();
    updateCounts();
    updateCursor();
    ensureCaretVisible();
  });

  /* ---------- File operations ---------- */
  // An opened file becomes a document. When it is the same file as an existing
  // document (both have handles and the browser says so), that document is
  // refreshed instead of duplicated.
  async function loadContent(text, name, handle) {
    let existing = null;
    if (handle) {
      for (const d of docs.values()) {
        if (!d.handle) continue;
        try { if (await handle.isSameEntry(d.handle)) { existing = d; break; } } catch (e) {}
      }
    }
    if (existing) {
      if (existing.id !== currentId) { const cur = captureCurrent(); if (cur) storeDoc(cur); }
      Object.assign(existing, { text, handle, fileName: name || '', dirty: false, modified: Date.now(),
                                cursor: [0, 0], scroll: { editor: 0, preview: 0 } });
      sortDocs();
      showDoc(existing.id);
      storeDoc(existing);
    } else {
      createDoc(text, { fileName: name || '', handle: handle || null });
    }
    saveStateEl.textContent = name ? 'Opened ' + timeNow() : '';
    if (mode !== 'preview') editor.focus();
  }

  const pickerTypes = [{
    description: 'Markdown',
    accept: { 'text/markdown': ['.md', '.markdown', '.mdown', '.txt'] }
  }];

  async function openFile() {
    if (window.showOpenFilePicker) {
      try {
        const [h] = await window.showOpenFilePicker({ types: pickerTypes });
        const f = await h.getFile();
        loadContent(await f.text(), f.name, h);
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return;
        // API unavailable in this context — fall back to classic input
      }
    }
    fileInput.click();
  }

  fileInput.addEventListener('change', async () => {
    const f = fileInput.files[0];
    if (f) loadContent(await f.text(), f.name, null);
    fileInput.value = '';
  });

  async function writeHandle(handle, text) {
    const w = await handle.createWritable();
    await w.write(text);
    await w.close();
  }

  function downloadBlob(text, name, type) {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // A handle restored from storage needs permission again after a reload.
  async function ensurePermission(handle) {
    if (!handle.queryPermission) return true;
    const opts = { mode: 'readwrite' };
    if (await handle.queryPermission(opts) === 'granted') return true;
    return (await handle.requestPermission(opts)) === 'granted';
  }

  async function saveFile() {
    const text = editor.value;
    if (fileHandle) {
      try {
        if (await ensurePermission(fileHandle)) {
          await writeHandle(fileHandle, text);
          setDirty(false);
          saveStateEl.textContent = 'Saved ' + timeNow();
          saveCurrentDoc();
          return;
        }
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
    }
    if (window.showSaveFilePicker) {
      try {
        const h = await window.showSaveFilePicker({
          suggestedName: fileName || 'untitled.md',
          types: pickerTypes
        });
        await writeHandle(h, text);
        fileHandle = h;
        fileName = h.name;
        setDirty(false);
        saveStateEl.textContent = 'Saved ' + timeNow();
        saveCurrentDoc();
        refreshTitle();
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
    }
    downloadBlob(text, fileName || 'untitled.md', 'text/markdown');
    setDirty(false);
    saveStateEl.textContent = 'Downloaded ' + timeNow();
  }

  function exportHtml() {
    render();
    const title = (fileName || 'document').replace(/\.(md|markdown|mdown|txt)$/i, '');
    const styleText = document.querySelector('style').textContent;
    const doc = '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>' + title.replace(/</g, '&lt;') + '</title>\n' +
      '<scr' + 'ipt>document.documentElement.setAttribute("data-theme",' +
      'matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");</scr' + 'ipt>\n' +
      '<style>' + styleText + '\n' +
      'html,body{height:auto}body{display:block;overflow:auto}' +
      '#previewPane{overflow:visible}#preview{padding-bottom:64px}\n' +
      '</style>\n</head>\n<body class="mode-preview">\n' +
      '<section id="previewPane"><article id="preview">' + preview.innerHTML +
      '</article></section>\n</body>\n</html>\n';
    downloadBlob(doc, title + '.html', 'text/html');
  }

  document.getElementById('btnNew').addEventListener('click', () => { createDoc(''); if (mode !== 'preview') editor.focus(); });
  document.getElementById('btnOpen').addEventListener('click', openFile);
  document.getElementById('btnSave').addEventListener('click', saveFile);
  document.getElementById('btnExport').addEventListener('click', exportHtml);

  /* ---------- Print ---------- */
  // Print in the light palette whatever the screen theme, and make sure the
  // preview is not a debounce behind the editor.
  // Browsers name a saved PDF after the page title, so it is just the
  // document name while printing.
  let themeBeforePrint = null;
  let titleBeforePrint = null;
  window.addEventListener('beforeprint', () => {
    render();
    themeBeforePrint = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', 'light');
    titleBeforePrint = document.title;
    const doc = docs.get(currentId);
    document.title = doc ? docTitle(doc) : 'Document';
  });
  window.addEventListener('afterprint', () => {
    if (themeBeforePrint) document.documentElement.setAttribute('data-theme', themeBeforePrint);
    if (titleBeforePrint != null) document.title = titleBeforePrint;
    themeBeforePrint = null;
    titleBeforePrint = null;
  });
  document.getElementById('btnPrint').addEventListener('click', () => window.print());

  window.addEventListener('beforeunload', e => {
    if (dirty && fileHandle) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  /* ---------- Drag & drop ---------- */
  let dragDepth = 0;
  window.addEventListener('dragenter', e => {
    if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) {
      e.preventDefault();
      dragDepth++;
      body.classList.add('dragging');
    }
  });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('dragleave', () => {
    if (--dragDepth <= 0) { dragDepth = 0; body.classList.remove('dragging'); }
  });
  window.addEventListener('drop', async e => {
    e.preventDefault();
    dragDepth = 0;
    body.classList.remove('dragging');
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if (f) loadContent(await f.text(), f.name, null);
  });


  /* ---------- Documents (IndexedDB) ---------- */
  // Every document is one record in the `docs` store. Images get their own
  // store so the text stays small. The browser copy is the working copy; a
  // file handle only says where Save writes. Storage is best effort: if
  // IndexedDB is unavailable the editor keeps working for this tab.
  const idb = (() => {
    let opening = null;
    function open() {
      if (opening) return opening;
      opening = new Promise((resolve, reject) => {
        if (!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
        const req = indexedDB.open('mdadv', 1);
        req.onupgradeneeded = () => {
          const d = req.result;
          if (!d.objectStoreNames.contains('docs')) {
            d.createObjectStore('docs', { keyPath: 'id' }).createIndex('modified', 'modified');
          }
          if (!d.objectStoreNames.contains('images')) {
            d.createObjectStore('images', { keyPath: 'id' }).createIndex('docId', 'docId');
          }
        };
        req.onsuccess = () => {
          const d = req.result;
          // Another tab is upgrading or deleting the database: let go of it
          // and reconnect on the next access.
          d.onversionchange = () => { d.close(); opening = null; };
          resolve(d);
        };
        req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
      });
      return opening;
    }
    function run(storeName, mode, fn) {
      return open().then(d => new Promise((resolve, reject) => {
        const t = d.transaction(storeName, mode);
        const r = fn(t.objectStore(storeName));
        t.oncomplete = () => resolve(r ? r.result : undefined);
        t.onerror = () => reject(t.error);
        t.onabort = () => reject(t.error || new Error('Transaction aborted'));
      }));
    }
    return {
      all: s => run(s, 'readonly', o => o.getAll()),
      put: (s, v) => run(s, 'readwrite', o => o.put(v)),
      del: (s, k) => run(s, 'readwrite', o => o.delete(k)),
      delWhere: (s, index, key) => run(s, 'readwrite', o => {
        const req = o.index(index).openKeyCursor(IDBKeyRange.only(key));
        req.onsuccess = () => { const c = req.result; if (c) { o.delete(c.primaryKey); c.continue(); } };
      })
    };
  })();

  const docs = new Map();   // id -> record
  let docOrder = [];        // ids, most recently modified first; resorted on structural changes only
  let currentId = null;
  let storageWarned = false;

  function newId() { return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function makeDoc(text) {
    const now = Date.now();
    return { id: newId(), name: '', text: text || '', cursor: [0, 0], scroll: { editor: 0, preview: 0 },
             created: now, modified: now, fileName: '', handle: null, dirty: false };
  }

  function docTitle(doc) {
    if (doc.name) return doc.name;
    if (doc.fileName) return doc.fileName;
    const m = doc.text.match(/^\s{0,3}#{1,6}\s+(.+?)\s*#*\s*$/m);
    let t = m ? m[1] : (doc.text.split('\n').find(l => l.trim()) || '');
    t = t.replace(/[*_`~#>]/g, '').trim();
    if (!t) return 'Untitled';
    return t.length > 60 ? t.slice(0, 57) + '…' : t;
  }

  function storageFailed(e) {
    if (!storageWarned) {
      storageWarned = true;
      saveStateEl.textContent = 'Browser storage unavailable; documents will not persist';
    }
    console.warn('Document storage failed', e);
  }

  async function storeDoc(doc) {
    try {
      await idb.put('docs', doc);
    } catch (e) {
      if (doc.handle && e && e.name === 'DataCloneError') {
        // This browser cannot store file handles; keep everything else.
        try { await idb.put('docs', Object.assign({}, doc, { handle: null })); return; } catch (e2) { e = e2; }
      }
      storageFailed(e);
    }
  }

  function sortDocs() {
    docOrder = Array.from(docs.values()).sort((a, b) => b.modified - a.modified).map(d => d.id);
  }

  // Copy the editor state into the current record. `modified` only moves when the text changed.
  function captureCurrent() {
    const doc = docs.get(currentId);
    if (!doc) return null;
    if (doc.text !== editor.value) { doc.text = editor.value; doc.modified = Date.now(); }
    doc.cursor = [editor.selectionStart, editor.selectionEnd];
    doc.scroll = { editor: editor.scrollTop, preview: previewPane.scrollTop };
    doc.dirty = dirty;
    doc.fileName = fileName;
    doc.handle = fileHandle;
    return doc;
  }

  function saveCurrentDoc() {
    const doc = captureCurrent();
    if (!doc) return;
    storeDoc(doc);
    refreshTitle();
    if (!docEditing) renderDocList();
  }

  function refreshTitle() {
    const doc = docs.get(currentId);
    const t = doc ? docTitle(doc) : 'Draft';
    fileNameEl.textContent = t;
    document.title = t + ' — Markdown Editor Advanced';
  }

  // Put a document in the editor and restore its caret and scroll positions.
  function showDoc(id) {
    const doc = docs.get(id);
    if (!doc) return;
    currentId = id;
    store.set('mdadv.currentDoc', id);
    fileHandle = doc.handle || null;
    fileName = doc.fileName || '';
    editor.value = doc.text;
    renderOverlay();
    setDirty(!!doc.dirty);
    saveStateEl.textContent = '';
    refreshTitle();
    render();
    updateCounts();
    const c = doc.cursor || [0, 0];
    editor.setSelectionRange(c[0], c[1]);
    // Both panes are positioned explicitly; keep the scroll sync out of it.
    scrollLock = 'restore';
    clearTimeout(scrollLockTimer);
    scrollLockTimer = setTimeout(() => { scrollLock = null; }, 200);
    editor.scrollTop = doc.scroll ? doc.scroll.editor : 0;
    previewPane.scrollTop = doc.scroll ? doc.scroll.preview : 0;
    syncOverlayScroll();
    updateCursor();
    renderDocList();
  }

  function switchDoc(id) {
    if (id === currentId || !docs.has(id)) return;
    const cur = captureCurrent();
    if (cur) storeDoc(cur);
    showDoc(id);
    if (mode !== 'preview') editor.focus();
  }

  function createDoc(text, extra) {
    const cur = captureCurrent();
    if (cur) storeDoc(cur);
    const doc = Object.assign(makeDoc(text), extra || {});
    docs.set(doc.id, doc);
    storeDoc(doc);
    sortDocs();
    showDoc(doc.id);
    return doc;
  }

  function deleteDoc(id) {
    if (!docs.has(id)) return;
    docs.delete(id);
    sortDocs();
    if (id === currentId) {
      if (docOrder.length) showDoc(docOrder[0]); else createDoc('');
    } else {
      renderDocList();
    }
    idb.del('docs', id).then(() => idb.delWhere('images', 'docId', id)).catch(storageFailed);
  }

  function renameDoc(id, name) {
    const doc = docs.get(id);
    if (!doc) return;
    doc.name = name.trim();
    storeDoc(doc);
    if (id === currentId) refreshTitle();
  }

  function relTime(ts) {
    const d = Date.now() - ts;
    if (d < 60e3) return 'just now';
    if (d < 3600e3) return Math.round(d / 60e3) + ' min ago';
    if (d < 86400e3) return Math.round(d / 3600e3) + ' h ago';
    return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  /* ---------- Documents panel ---------- */
  const docListEl = document.getElementById('docList');
  let docEditing = null;   // { id, mode: 'rename' | 'delete' } while a row is being edited

  const ICON_RENAME = '<svg viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>';
  const ICON_DELETE = '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';

  function renderDocList() {
    const frag = document.createDocumentFragment();
    let focusInput = null;
    for (const id of docOrder) {
      const doc = docs.get(id);
      const item = document.createElement('div');
      item.className = 'doc-item' + (id === currentId ? ' active' : '');
      item.dataset.id = id;
      const editing = docEditing && docEditing.id === id ? docEditing.mode : null;
      if (editing === 'rename') {
        const input = document.createElement('input');
        input.className = 'doc-rename';
        input.value = doc.name || docTitle(doc);
        input.setAttribute('aria-label', 'Document name');
        item.appendChild(input);
        focusInput = input;
      } else if (editing === 'delete') {
        item.classList.add('confirm');
        item.innerHTML = '<div class="doc-main"><div class="doc-name">Delete "' + escHtml(docTitle(doc)) + '"?</div></div>' +
          '<div class="doc-actions"><button class="doc-btn text danger" data-act="confirm-delete">Delete</button>' +
          '<button class="doc-btn text" data-act="cancel">Cancel</button></div>';
      } else {
        item.innerHTML = '<div class="doc-main"><div class="doc-name">' + escHtml(docTitle(doc)) + '</div>' +
          '<div class="doc-meta">' + relTime(doc.modified) + (doc.fileName ? ' · file' : '') + (doc.dirty && doc.fileName ? ' · unsaved' : '') + '</div></div>' +
          '<div class="doc-actions"><button class="doc-btn" data-act="rename" title="Rename">' + ICON_RENAME + '</button>' +
          '<button class="doc-btn" data-act="delete" title="Delete">' + ICON_DELETE + '</button></div>';
      }
      frag.appendChild(item);
    }
    if (!docOrder.length) {
      const empty = document.createElement('div');
      empty.className = 'docs-empty';
      empty.textContent = 'No documents';
      frag.appendChild(empty);
    }
    docListEl.replaceChildren(frag);
    if (focusInput) { focusInput.focus(); focusInput.select(); }
  }

  function commitRename(input) {
    if (!docEditing || docEditing.mode !== 'rename') return;
    const id = docEditing.id;
    docEditing = null;
    renameDoc(id, input.value);
    renderDocList();
  }
  function cancelDocEdit() {
    if (!docEditing) return;
    docEditing = null;
    renderDocList();
  }

  docListEl.addEventListener('click', e => {
    const item = e.target.closest('.doc-item');
    if (!item) return;
    const id = item.dataset.id;
    const btn = e.target.closest('button[data-act]');
    if (btn) {
      const act = btn.dataset.act;
      if (act === 'rename') { docEditing = { id, mode: 'rename' }; renderDocList(); }
      else if (act === 'delete') { docEditing = { id, mode: 'delete' }; renderDocList(); }
      else if (act === 'confirm-delete') { docEditing = null; deleteDoc(id); }
      else if (act === 'cancel') cancelDocEdit();
      return;
    }
    if (e.target.closest('input')) return;
    switchDoc(id);
  });
  docListEl.addEventListener('dblclick', e => {
    const item = e.target.closest('.doc-item');
    if (!item || e.target.closest('button') || e.target.closest('input')) return;
    docEditing = { id: item.dataset.id, mode: 'rename' };
    renderDocList();
  });
  docListEl.addEventListener('keydown', e => {
    if (!e.target.classList.contains('doc-rename')) return;
    if (e.key === 'Enter') { e.preventDefault(); commitRename(e.target); if (mode !== 'preview') editor.focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); cancelDocEdit(); if (mode !== 'preview') editor.focus(); }
  });
  docListEl.addEventListener('focusout', e => {
    if (e.target.classList.contains('doc-rename') && docEditing && docEditing.mode === 'rename') commitRename(e.target);
  });

  const sideTabs = document.querySelectorAll('.side-tab');
  function showSidePanel(name) {
    sideTabs.forEach(b => b.classList.toggle('active', b.dataset.panel === name));
    document.getElementById('panelContents').hidden = name !== 'contents';
    document.getElementById('panelDocuments').hidden = name !== 'documents';
    store.set('mdadv.sidetab', name);
  }
  sideTabs.forEach(b => b.addEventListener('click', () => showSidePanel(b.dataset.panel)));
  document.getElementById('btnNewDoc').addEventListener('click', () => { createDoc(''); if (mode !== 'preview') editor.focus(); });

  // Save positions as they change, and flush everything when the tab goes away.
  editor.addEventListener('scroll', savePositions);
  previewPane.addEventListener('scroll', savePositions);
  editor.addEventListener('keyup', savePositions);
  editor.addEventListener('click', savePositions);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { const d = captureCurrent(); if (d) storeDoc(d); }
  });
  window.addEventListener('pagehide', () => { const d = captureCurrent(); if (d) storeDoc(d); });

  async function initDocuments() {
    let list = [];
    try { list = await idb.all('docs'); } catch (e) { storageFailed(e); }
    if (!list.length) {
      // One-time import of the single-document draft. The old key is left in
      // place on purpose: it is the fallback if this storage ever fails.
      const draft = store.get('mdadv.content');
      const first = makeDoc(draft != null && draft !== '' ? draft : WELCOME);
      list = [first];
      storeDoc(first);
    }
    list.forEach(d => docs.set(d.id, d));
    sortDocs();
    const wanted = store.get('mdadv.currentDoc');
    showDoc(docs.has(wanted) ? wanted : docOrder[0]);
    if (mode !== 'preview') editor.focus();
  }

  /* ---------- Welcome document ---------- */
  const WELCOME = [
    '# Welcome to your Markdown Editor 📝',
    '',
    'Everything runs **locally in this one file** — no server, no internet needed.',
    'Your work auto-saves to this browser as you type.',
    '',
    '## Views & panels',
    '',
    '- **Edit / Split / Preview** — switch with the buttons up top, or `⌘1` / `⌘2` / `⌘3`',
    '- **Table of contents** — the panel on the right; toggle it with `⌘.` or the sidebar button',
    '- **Dark mode** — the moon/sun button (remembered for next time)',
    '- In split view, the two panes **scroll together**',
    '',
    '## Formatting',
    '',
    'Use the toolbar or shortcuts: **bold** (`⌘B`), *italic* (`⌘I`),',
    '~~strikethrough~~, `inline code` (`⌘E`), and [links](https://example.com) (`⌘K`).',
    '',
    '> Blockquotes, lists, and tables are one click away in the toolbar.',
    '',
    '### Task lists',
    '',
    '- [x] Open the editor',
    '- [x] Read the welcome tour',
    '- [ ] Write something great',
    '',
    'Press `Enter` inside a list and it continues automatically — press `Enter` on an',
    'empty item to end the list. `Tab` / `Shift+Tab` indent and outdent.',
    '',
    '### Code with syntax highlighting',
    '',
    '```javascript',
    'function greet(name) {',
    '  const message = "Hello, " + name + "!";',
    '  console.log(message);   // prints the greeting',
    '  return message.length > 0;',
    '}',
    '```',
    '',
    '```python',
    'def fibonacci(n: int) -> list[int]:',
    '    """First n Fibonacci numbers."""',
    '    seq = [0, 1]',
    '    while len(seq) < n:',
    '        seq.append(seq[-1] + seq[-2])',
    '    return seq[:n]',
    '```',
    '',
    '### Tables',
    '',
    '| Feature | Shortcut | Notes |',
    '| ------- | -------- | ----- |',
    '| Save | `⌘S` | Saves back to the opened file when possible |',
    '| Export | toolbar | Standalone styled HTML |',
    '| Open | toolbar | Or just drag a `.md` file onto the window |',
    '',
    '## Files',
    '',
    'Open a Markdown file with the folder button (or drag & drop it here).',
    'Save with `⌘S` — in Chrome and Edge this writes straight back to the file;',
    'elsewhere it downloads a copy. Export produces a polished standalone HTML page.',
    '',
    '---',
    '',
    'Select all of this and start typing to begin your own document. Happy writing!'
  ].join('\n');

  /* ---------- Init ---------- */
  const savedMode = store.get('mdadv.mode');
  if (savedMode === 'edit' || savedMode === 'split' || savedMode === 'preview') mode = savedMode;
  setMode(mode);

  if (store.get('mdadv.toc') === '0') {
    body.classList.remove('toc-open');
  } else {
    document.getElementById('btnToc').classList.add('toggled');
  }

  applyThemeIcon();
  showSidePanel(store.get('mdadv.sidetab') === 'documents' ? 'documents' : 'contents');

  renderOverlay();
  render();
  updateCounts();
  updateCursor();
  initDocuments();
})();
</script>
</body>
</html>
